schema_version: 2
authority: formal_standard
authoritative_ref: default_branch
content_mode: markdown_only
precedence:
  - project_override
  - canonical_standard
  - last_known_good
  - bundled_fallback
refresh:
  startup: true
  task_freshness_minutes: 15
  force_command: coop sync
  failure_mode: last_known_good
  pin_revision_per_task: true
  invalidate_index_on_revision_change: true
standards:
  sql:
    section_refs: file_and_heading
    base:
      - sql/formatting.md
    layers:
      silver:
        base:
          - sql/silver/deterministic-generation.md
        artifacts: {}
      gold:
        base: []
        artifacts:
          stored_procedure:
            - sql/gold/stored-procedures.md
          fact_table:
            - sql/gold/fact-tables.md
          dimension_table:
            - sql/gold/dimension-tables.md
          view:
            - sql/gold/views.md
    targets:
      fabric_warehouse:
        - tech/fabric/warehouse.md
      azure_sql: []
  powerbi:
    section_refs: file_and_heading
    file_type:
      - powerbi/file-types.md
    semantic_model:
      artifacts:
        m_query:
          - powerbi/semantic-model/m-query.md
        table:
          - powerbi/semantic-model/tables.md
        fact_table:
          - powerbi/semantic-model/m-query.md
          - powerbi/semantic-model/tables.md
          - powerbi/semantic-model/fact-tables.md
          - powerbi/semantic-model/measures.md
        relationship:
          - powerbi/semantic-model/relationships.md
        measure:
          - powerbi/semantic-model/measures.md
          - powerbi/semantic-model/dax.md
        measure_table:
          - powerbi/semantic-model/m-query.md
          - powerbi/semantic-model/measures.md
        dax_expression:
          - powerbi/semantic-model/dax.md
        composite_model:
          - powerbi/semantic-model/composite-models.md
    reports:
      artifacts:
        visual:
          - powerbi/reports/visuals.md
